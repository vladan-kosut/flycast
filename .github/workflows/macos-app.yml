# macOS-only build for the donald-* branches of this fork.
# Build steps are copied from c-cpp.yml (apple-darwin) at v2.7; packaging uses
# ditto so symlinks and permissions inside Flycast.app survive the artifact upload.
name: macOS app

on:
  push:
    branches:
      - 'donald-**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Set up build environment (macOS)
        run: |
          # Unlink and re-link to prevent errors when github mac runner images install python outside of brew. See https://github.com/actions/setup-python/issues/577
          brew list -1 | grep python | while read formula; do brew unlink $formula; brew link --overwrite $formula; done
          brew update || :
          brew install libao ldid pulseaudio
          brew uninstall --ignore-dependencies zstd
          VULKAN_VER=1.4.341.1 && aria2c https://sdk.lunarg.com/sdk/download/$VULKAN_VER/mac/vulkan_sdk.zip?Human=true -o vulkan_sdk.zip
          unzip -q vulkan_sdk.zip
          ./vulkansdk-macOS-$VULKAN_VER.app/Contents/MacOS/vulkansdk-macOS-$VULKAN_VER --root $HOME/VulkanSDK --accept-licenses --default-answer --confirm-command install copy_only=1
          rm -f vulkan_sdk.zip
          rm -rf ./vulkansdk-macOS-$VULKAN_VER.app
          echo "VULKAN_SDK=$HOME/VulkanSDK/macOS" >> $GITHUB_ENV

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compile universal dependencies (macOS)
        run: |
          for formula in ./shell/apple/libomp.rb ./shell/apple/libpng-flycast.rb; do
            libname=$(basename "$formula" .rb)
            HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_DEVELOPER=1 brew install --build-from-source --formula "$formula" || \
            HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_DEVELOPER=1 brew reinstall --build-from-source --formula "$formula"
            
            prefix=$(brew --prefix $libname)
            # Find and verify the static library
            libfile=$(find "$prefix/lib" -name "*.a" | head -n1)
            lipo -info "$libfile"
            
            # Export prefix for subsequent CMake steps
            if [ -z "$CMAKE_PREFIX_PATH" ]; then
              CMAKE_PREFIX_PATH="$prefix"
            else
              CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH:$prefix"
            fi
          done
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> $GITHUB_ENV

      - name: CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=artifact -G Xcode -DUSE_DISCORD=ON
          cmake --build build --config RelWithDebInfo --target install

      - name: Package app
        run: |
          ditto -c -k --keepParent artifact/bin/Flycast.app flycast-macOS.zip
          lipo -info artifact/bin/Flycast.app/Contents/MacOS/Flycast
          shasum -a 256 flycast-macOS.zip | tee flycast-macOS.zip.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: flycast-macOS-${{ github.sha }}
          path: |
            flycast-macOS.zip
            flycast-macOS.zip.sha256
